  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iterations, hash: "SHA-256"},
    baseKey,
    {name: "AES-GCM", length: 256},
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(payload.nonce)}, key, b64(payload.ciphertext));
  return new TextDecoder().decode(plain);
}
function initDashboard() {
  const root = document.getElementById("content");
  const dataNode = root.querySelector("#dashboard-data");
  const dashboard = dataNode ? JSON.parse(dataNode.textContent) : {};
  const daily = Object.entries(dashboard.summary?.trailing?.daily || {}).sort(([a], [b]) => a.localeCompare(b));
  const money = value => new Intl.NumberFormat("en-GB", {style: "currency", currency: "GBP", maximumFractionDigits: 0}).format(value || 0);
  const number = value => new Intl.NumberFormat("en-GB", {maximumFractionDigits: 0}).format(value || 0);
  const roas = value => Number.isFinite(value) ? `${value.toFixed(1)}x` : "n/a";

  root.querySelectorAll("[data-tab]").forEach(button => {
    button.addEventListener("click", () => {
      root.querySelectorAll("[data-tab]").forEach(item => item.classList.toggle("active", item === button));
      root.querySelectorAll("[data-panel]").forEach(panel => panel.classList.toggle("active", panel.dataset.panel === button.dataset.tab));
    });
  });

  function updateRange(days) {
    const selected = daily.slice(-days);
    const totals = selected.reduce((acc, [, row]) => {
      acc.revenue += Number(row.shopify_revenue || 0);
      acc.orders += Number(row.shopify_orders || 0);
      acc.spend += Number(row.paid_spend || 0);
      return acc;
    }, {revenue: 0, orders: 0, spend: 0});
    const blended = totals.spend > 0 ? totals.revenue / totals.spend : NaN;
    root.querySelector('[data-range-kpi="revenue"]').textContent = money(totals.revenue);
    root.querySelector('[data-range-kpi="orders"]').textContent = number(totals.orders);
    root.querySelector('[data-range-kpi="spend"]').textContent = money(totals.spend);
    root.querySelector('[data-range-kpi="blendedRoas"]').textContent = roas(blended);
    const visibleDays = new Set(selected.map(([day]) => day));
    root.querySelectorAll("[data-trend-day]").forEach(row => {
      row.style.display = visibleDays.has(row.dataset.trendDay) ? "" : "none";
    });
  }

  root.querySelectorAll("[data-range]").forEach(button => {
    button.addEventListener("click", () => {
      root.querySelectorAll("[data-range]").forEach(item => item.classList.toggle("active", item === button));
      updateRange(Number(button.dataset.range));
    });
  });
  if (daily.length) updateRange(7);

  const platformFilter = root.querySelector("#platform-filter");
  const campaignSearch = root.querySelector("#campaign-search");
  function filterCampaigns() {
    const platform = platformFilter?.value || "all";
    const query = (campaignSearch?.value || "").trim().toLowerCase();
    root.querySelectorAll("[data-campaign-row]").forEach(row => {
      const platformOk = platform === "all" || row.dataset.platform === platform;
      const queryOk = !query || row.dataset.campaign.includes(query);
      row.style.display = platformOk && queryOk ? "" : "none";
    });
  }
  platformFilter?.addEventListener("change", filterCampaigns);
  campaignSearch?.addEventListener("input", filterCampaigns);
}
document.getElementById("form").addEventListener("submit", async event => {
  event.preventDefault();
  document.getElementById("err").style.display = "none";
  try {
    document.getElementById("content").innerHTML = await decrypt(document.getElementById("password").value);
    document.getElementById("gate").remove();
    initDashboard();
  } catch (_err) {
    document.getElementById("err").style.display = "block";
  }
});
</script>
</body>
</html>
